<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fntv-Plus 构建监控</title>
<style>
  :root {
    --bg: #0f1419; --panel: #161b22; --border: #232b36;
    --text: #c9d1d9; --muted: #7d8693;
    --accent: #3b82f6; --green: #2ea043; --red: #f85149; --gray: #3b424d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px; max-width: 920px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .ver { color: var(--accent); font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .progress-wrap { background: var(--gray); border-radius: 999px; height: 10px; overflow: hidden; margin-bottom: 22px; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg,#3b82f6,#22d3ee); transition: width .4s ease; }
  .stages { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .stage {
    display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; background: var(--gray); }
  .stage.active .dot { background: var(--accent); animation: pulse 1.1s infinite; }
  .stage.done .dot { background: var(--green); }
  .stage.error .dot { background: var(--red); }
  .stage.skipped .dot { background: repeating-linear-gradient(45deg, var(--gray), var(--gray) 3px, #2a313c 3px, #2a313c 6px); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .stage .label { flex: 1; font-size: 14px; }
  .stage .detail { color: var(--muted); font-size: 12px; }
  .stage.done .label { color: var(--green); }
  .stage.error .label { color: var(--red); }
  .stage.skipped .label { color: var(--muted); text-decoration: line-through; opacity: .7; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--border); color: var(--muted); }
  .stage.active .badge { background: rgba(59,130,246,.2); color: #93c5fd; }
  .stage.done .badge { background: rgba(46,160,67,.2); color: #7ee2a0; }
  .stage.error .badge { background: rgba(248,81,73,.2); color: #ffb3ae; }
  .stage.skipped .badge { background: var(--border); color: var(--muted); }
  .log {
    background: #0a0e13; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; height: 280px; overflow-y: auto; font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px; line-height: 1.6; color: #9aa7b3; white-space: pre-wrap; word-break: break-all;
  }
  .log .err { color: var(--red); }
  .result {
    margin-top: 18px; padding: 14px 16px; border-radius: 10px; display: none;
    border: 1px solid var(--border); background: var(--panel); font-size: 14px;
  }
  .result.ok { border-color: rgba(46,160,67,.5); }
  .result.fail { border-color: rgba(248,81,73,.5); }
  .result code { color: var(--accent); word-break: break-all; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>🔧 Fntv-Plus 构建监控 <span class="ver" id="ver">v?</span></h1>
  <div class="meta">已用时 <span id="elapsed">0s</span> · 实时刷新中…</div>

  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>

  <div class="stages" id="stages"></div>

  <div class="log" id="log"></div>

  <div class="result" id="result"></div>

<script>
  const $ = id => document.getElementById(id);
  let lastLogLen = 0;
  let stick = true;

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return (m > 0 ? m + 'm ' : '') + (s % 60) + 's';
  }
  function badge(status) {
    return { pending: '等待', active: '进行中', done: '完成', error: '出错', skipped: '跳过' }[status] || status;
  }
  function render(s) {
    $('ver').textContent = 'v' + s.version;
    const done = s.stages.filter(x => x.status === 'done').length;
    const active = s.stages.filter(x => x.status === 'active').length;
    const pct = Math.round(((done + active * 0.5) / s.stages.length) * 100);
    $('bar').style.width = pct + '%';

    const wrap = $('stages');
    wrap.innerHTML = s.stages.map(st => `
      <div class="stage ${st.status}">
        <div class="dot"></div>
        <div class="label">${st.label}${st.detail ? ` <span class="detail">— ${st.detail}</span>` : ''}</div>
        <div class="badge">${badge(st.status)}</div>
      </div>`).join('');

    const logEl = $('log');
    const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
    if (s.log.length !== lastLogLen) {
      logEl.innerHTML = s.log.map(l => {
        const cls = /error|fail|npm error/i.test(l) ? ' class="err"' : '';
        return `<div${cls}>${l.replace(/</g, '&lt;')}</div>`;
      }).join('');
      lastLogLen = s.log.length;
      if (atBottom || stick) logEl.scrollTop = logEl.scrollHeight;
    }

    const r = $('result');
    if (s.done) {
      r.style.display = 'block';
      r.className = 'result ok';
      r.innerHTML = `✅ 构建完成！安装包路径：<br><code>${s.exePath || '(见 release 目录)'}</code>
        <div class="hint">可直接复制路径到资源管理器打开；覆盖安装前建议先卸载旧版。</div>`;
    } else if (s.error && !s.done) {
      r.style.display = 'block';
      r.className = 'result fail';
      r.innerHTML = `❌ 构建失败：${s.error}`;
    } else {
      r.style.display = 'none';
    }
  }

  async function tick() {
    try {
      const r = await fetch('/status');
      const s = await r.json();
      $('elapsed').textContent = fmt(Date.now() - s.startTime);
      render(s);
    } catch (e) { /* ignore transient errors */ }
    setTimeout(tick, 800);
  }
  tick();
</script>
</body>
</html>
