# Fntv-Plus 匿名统计 / 反馈服务端（Cloudflare Workers）
# 部署步骤见同目录 README.md
name = "fntv-stats"
main = "worker.js"
compatibility_date = "2026-09-18"

# D1：存心跳与反馈元数据
[[d1_databases]]
binding = "DB"
database_name = "fntv-stats"
database_id = "39b66bd5-a309-4a86-963b-955f34ea5930"

# R2：存反馈附带的日志正文（免费额度 10GB，够用很久）
# ⚠ 新账号需先在 Cloudflare Dashboard 里启用 R2（控制台 → R2 → 启用，会走一次开通流程），
#    否则 wrangler 报 code 10042。启用后把下面三行的 # 去掉，重新 `npx wrangler deploy` 即可，
#    统计功能完全不受影响 —— 未启用期间只是反馈日志存不下来（反馈描述仍能收到）。
# [[r2_buckets]]
# binding = "LOGS"
# bucket_name = "fntv-stats-logs"

# STATS_TOKEN 不要写在这里，用 secret：
#   npx wrangler secret put STATS_TOKEN
