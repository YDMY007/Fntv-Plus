# Fntv-Plus 匿名统计 / 反馈服务端（Cloudflare Workers）
# 部署步骤见同目录 README.md
name = "fntv-stats"
main = "worker.js"
compatibility_date = "2026-09-18"

# D1：存心跳与反馈元数据
[[d1_databases]]
binding = "DB"
database_name = "fntv-stats"
database_id = "在这里填 wrangler d1 create 返回的 database_id"

# R2：存反馈附带的日志正文（免费额度 10GB，够用很久）
[[r2_buckets]]
binding = "LOGS"
bucket_name = "fntv-stats-logs"

# STATS_TOKEN 不要写在这里，用 secret：
#   npx wrangler secret put STATS_TOKEN
