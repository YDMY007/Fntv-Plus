name: Download Badge

on:
  # 每日汇总一次下载量（含已删旧仓库的冻结历史值）写入 badge-data 分支，供 README 徽章读取。
  # 发布新 Release 后也会立即跑一次，让徽章当天就更新。
  schedule:
    - cron: '17 3 * * *'   # 每天 UTC 3:17（北京 11:17）
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# 已删旧仓库（Fntv-Plus-old / 上游时期）无法再从 API 统计的下载量，取删除当天从
# releases.json 备份固化的冻结值；如后续又有需要并入的固定量，直接改这个常量。
env:
  LEGACY_DOWNLOADS: '1967'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推送 badge-data 分支
    steps:
      - name: 汇总下载量
        id: sum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq '[.[].assets[].download_count] | add // 0')
          TOTAL=$((CURRENT + LEGACY_DOWNLOADS))
          echo "current=$CURRENT legacy=$LEGACY_DOWNLOADS total=$TOTAL"
          {
            echo "current=$CURRENT"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

      - name: 写入 badge-data 分支
        env:
          TOTAL: ${{ steps.sum.outputs.total }}
          CURRENT: ${{ steps.sum.outputs.current }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          api="repos/${GITHUB_REPOSITORY}/contents/downloads.json"
          json=$(printf '{"total":%s,"githubCurrent":%s,"legacy":1967,"updatedAt":"%s"}' \
            "$TOTAL" "$CURRENT" "$(date -u +%FT%TZ)")
          content=$(printf '%s' "$json" | base64 -w0)
          msg="downloads: $TOTAL (current=$CURRENT + legacy=1967) @ $(date -u +%FT%TZ)"
          # 已存在则拿到其 sha 以便更新，不存在则新建
          sha=$(gh api "$api?ref=badge-data" --jq '.sha' 2>/dev/null || true)
          # 用 --field 传参避免手拼 JSON 的引号/转义问题
          if [ -n "$sha" ]; then
            gh api -X PUT "$api" -f message="$msg" -f content="$content" -f branch=badge-data -f sha="$sha" > /dev/null \
              && echo "badge-data/downloads.json 已更新 (total=$TOTAL)"
          else
            gh api -X PUT "$api" -f message="$msg" -f content="$content" -f branch=badge-data > /dev/null \
              && echo "badge-data/downloads.json 已新建 (total=$TOTAL)"
          fi
