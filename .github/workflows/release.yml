name: Release Build

on:
  # 由维护者手动发布 Release（并上传 Windows 安装包）后触发：
  # CI 自动构建 macOS / Linux 安装包并追加上传到该 Release。
  # 普通 push 不再触发任何构建。
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean npm config
        run: |
          rm -f .npmrc
        shell: bash
        continue-on-error: true

      - name: Install dependencies
        run: npm install --no-optional --no-audit --no-fund
        timeout-minutes: 10

      - name: Install macOS specific dependencies
        if: runner.os == 'macOS'
        run: |
          # 确保 dmg-license 正确安装
          npm install dmg-license --save-dev
          # 安装额外的 macOS 构建依赖
          npm install --no-optional
        timeout-minutes: 5

      - name: Setup Python (for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        continue-on-error: true

      - name: Download third-party dependencies
        run: |
          echo "🔄 Downloading latest fntv-mpv-config..."
          
          # 获取最新 release 的下载链接 (使用认证以避免速率限制)
          LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/QiaoKes/fntv-mpv-config/releases/latest)
          echo "Latest release info: $LATEST_RELEASE"
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | sed -n 's/.*"browser_download_url": "\(https[^"]*\.zip\)".*/\1/p')

          echo "最新下载链接: $DOWNLOAD_URL"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ No zip file found, using fallback..."
            # 直接退出
            exit 1
          else
            echo "📦 Downloading from: $DOWNLOAD_URL"
            
            # 下载文件 (使用认证下载)
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o mpv-config.zip "$DOWNLOAD_URL"
            mkdir -p third_party/fntv-mpv
            
            # 根据平台使用不同的解压命令
            if [ "$RUNNER_OS" = "Windows" ]; then
              # Windows: 解压到临时目录再搬入，避免交互式覆盖提示与顶层目录嵌套
              TMPD=$(powershell -Command "New-Item -ItemType Directory -Force -Path (Join-Path \$env:TEMP ([System.Guid]::NewGuid().ToString())) | Select-Object -ExpandProperty FullName")
              powershell -Command "Expand-Archive -Path mpv-config.zip -DestinationPath '$TMPD' -Force"
              powershell -Command "\$items = Get-ChildItem -Path '$TMPD'; if (\$items.Count -eq 1 -and \$items[0].PSIsContainer) { Move-Item -Path (Join-Path \$items[0].FullName '*') -Destination third_party/fntv-mpv -Force } else { Move-Item -Path (Join-Path '$TMPD' '*') -Destination third_party/fntv-mpv -Force }"
              powershell -Command "Remove-Item -Path mpv-config.zip -Force -ErrorAction SilentlyContinue; Remove-Item -Path '$TMPD' -Recurse -Force -ErrorAction SilentlyContinue"
            else
              # macOS / Linux: 解压到临时目录，遇同名文件强制覆盖(-o)，并展平可能的单一顶层目录
              TMPD=$(mktemp -d)
              unzip -oq mpv-config.zip -d "$TMPD"
              shopt -s dotglob
              items=("$TMPD"/*)
              if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
                mv "${items[0]}"/. third_party/fntv-mpv/ 2>/dev/null || true
              else
                mv "$TMPD"/. third_party/fntv-mpv/ 2>/dev/null || true
              fi
              rm -rf "$TMPD" mpv-config.zip
            fi
          fi
          
          echo "📁 Final structure:"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows 使用 PowerShell 列出目录
            powershell -Command "Get-ChildItem -Path third_party/fntv-mpv -Directory -Recurse | Select-Object -First 5 | ForEach-Object { Write-Host \$_.FullName }"
          else
            # macOS 和 Linux 使用 find
            find third_party/fntv-mpv -type d | head -5
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile TypeScript
        run: npm run compile
        timeout-minutes: 5

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            npm run build:win
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            npm run build:mac
          else
            npm run build:linux
          fi
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: release/
          retention-days: 30
      # —— 构建后：兜底清理（避免影响后续/下次流水线）——
      - name: Post-clean DMG volumes (Fntv-Plus_* / FNMedia_* / 飞牛影视*)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
            set -euo pipefail
            matches="$(
            hdiutil info | awk -F': ' '/mount-point/ {print $2}' | \
            grep -E '^(\/Volumes\/Fntv-Plus_|\/Volumes\/FNMedia_|\/Volumes\/飞牛影视)' || true
            )"
            if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r V; do
                [ -z "$V" ] && continue
                echo "==> Force detaching leftover: $V"
                lsof +D "$V" || true
                hdiutil detach -force "$V" || true
                diskutil unmount force "$V" || true
            done
            else
            echo "No leftover volumes."
            fi

  release:
    name: Upload to Release
    needs: [build]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target tag
        id: tag
        run: |
          # release 事件：直接用触发本次构建的 Release 的 tag
          # workflow_dispatch 手动触发：兜底用 package.json 版本号拼 tag
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" | sort

      - name: Upload assets to existing Release
        uses: softprops/action-gh-release@v1
        with:
          # 只往维护者已手动发布的 Release 追加 macOS / Linux 安装包；
          # 不修改 Release 标题和说明（说明由维护者手动填写）。
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/macos-build/*.dmg
            artifacts/linux-build/*.AppImage
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
