routes = [
  { pattern = "690075.xyz", custom_domain = true },
  { pattern = "www.690075.xyz", custom_domain = true }
]

# 官网静态站（Workers Static Assets）
# 用法（项目根目录执行）：npx wrangler deploy --config site/wrangler.toml
name = "fntv-plus-site"
compatibility_date = "2026-09-18"

# 静态资源目录 = 本文件所在目录（site/），wrangler 直接 serve，无需 main 入口
[assets]
directory = "."

# 自定义域名：Worker 会代为在 zone 内创建 DNS 记录并签发证书
# （走 Workers 的路径，不需要 DNS 写权限；Pages 那条路当时卡在 "CNAME record not set"）
