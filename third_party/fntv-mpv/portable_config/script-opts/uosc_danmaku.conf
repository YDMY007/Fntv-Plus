# 自动加载
autoload_for_url=yes
auto_load=yes
# 自动补源：弹弹play 匹配后自动去 360kan 搜 B站弹幕并叠加（需联网；360kan 不通则静默跳过）

# 繁转简
chConvert=1

# 补帧弹幕平滑，费性能，不需要可以注释掉
vf_fps=yes
fps=60/1.001

# [lc-1298] 弹幕样式初始值（与设置面板 fnConfig 默认 50/0.7/1.2 对齐）：
# 旧初始值 fontsize=25 + opacity=0.6 + outline=1 在 1080p PlayRes 1:1 渲染下
# 小字＋六成透明＋1px 细边 = 用户感知的「弹幕很糊」；字体不指定时 libass 回退
# Microsoft YaHei UI Bold（UI 窄体）= 「字体怪」。面板保存样式时会覆盖以下各行。
# 弹幕字体（显式指定屏显正文字体，不写会被回退到 YaHei UI Bold）
fontname=Microsoft YaHei

# 弹幕字体大小
fontsize=50

# 弹幕透明度
opacity=0.7

# [lc-1253] 相同弹幕聚合：merge_window 秒窗口内同文本同类型合并为一条，渲染追加 ×N 并放大字号
merge_same_text=yes
merge_window=10
bold=no
outline=1.2
shadow=0
scrolltime=15
displayarea=0.35
# B站弹幕搜索开关（由应用设置面板控制，同时控制自动补源 auto_load_extra）
bili_search_enabled=yes
auto_load_extra=yes
# B站弹幕聚合阈值（单视频弹幕<此值时合并同类候选；0=禁用）
aggregate_threshold=1500
# 自建弹幕接口（danmu_api）：由应用设置面板控制，作为弹幕优选源；未命中自动降级内置B站弹幕
danmu_api_enabled=yes
