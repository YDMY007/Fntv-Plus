# 自动加载
autoload_for_url=yes
auto_load=yes
# 自动补源：弹弹play 匹配后自动去 360kan 搜 B站弹幕并叠加（需联网；360kan 不通则静默跳过）

# 繁转简
chConvert=1

# 补帧弹幕平滑，费性能，不需要可以注释掉
vf_fps=yes
fps=60/1.001

# 弹幕字体大小
fontsize=25

# 弹幕透明度
opacity=0.6
