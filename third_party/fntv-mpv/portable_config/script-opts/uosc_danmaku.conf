# 自动加载
autoload_for_url=yes
auto_load=yes
# 自动补源：弹弹play 匹配后自动去 360kan 搜 B站弹幕并叠加（需联网；360kan 不通则静默跳过）

# 繁转简
chConvert=1

# 补帧弹幕平滑（把视频复制帧到60fps，仅服务滤镜渲染路径）——费性能，默认关闭（原版行为）；
# OSD 渲染路径下弹幕平滑由 2/fps 步进定时器保证，不受此项影响
vf_fps=no
fps=60/1.001

# [lc-1301] 弹幕滤镜渲染（lc-1273）：把弹幕烙进视频帧、按视频分辨率光栅化——显示分辨率
# 高于视频分辨率时整帧上采样必糊（发糊主因），且逐帧硬解回传+补帧弹幕一多就卡，滤镜图
# 部分时机静默挂载失败还会「加载成功却一条不显示」。默认关闭走 OSD 屏幕分辨率渲染（清晰）。
filter_render=no

# [lc-1298] 弹幕样式初始值（与设置面板 fnConfig 默认 50/0.7/1.2 对齐）：
# 旧初始值 fontsize=25 + opacity=0.6 + outline=1 在 1080p PlayRes 1:1 渲染下
# 小字＋六成透明＋1px 细边 = 用户感知的「弹幕很糊」；字体不指定时 libass 回退
# Microsoft YaHei UI Bold（UI 窄体）= 「字体怪」。面板保存样式时会覆盖以下各行。
# 弹幕字体（显式指定屏显正文字体，不写会被回退到 YaHei UI Bold）
fontname=Microsoft YaHei

# 弹幕字体大小
fontsize=30

# 弹幕透明度
opacity=0.7

# [lc-1253] 相同弹幕聚合：merge_window 秒窗口内同文本同类型合并为一条，渲染追加 ×N 并放大字号
merge_same_text=yes
merge_window=10
bold=no
outline=1.2
shadow=0
# [lc-1292] 弹幕密度档位（样式菜单「弹幕密度」开关的档位真源）：
# yes=密集（默认）/ no=宽松（保留旧观感）。切换开关会一并改写下面 scrolltime 与 displayarea。
# 轨道池只按「可见区域 ÷ 行高」建（parse.lua DanmakuArray:new）。旧值 displayarea=0.35 +
# scrolltime=15 只用 9 行、容量 1.8 条/秒，观感稀稀拉拉；密集档如下 → 20 行、3.3 条/秒。
dense_danmaku=yes
# [lc-1292] 15 → 9：停留越短，同样轨道数下同时在屏的条数越多（容量 = 行数 ÷ 停留秒数）
scrolltime=9
# [lc-1292] 0.35 → 0.75：可用显示高度从屏幕 35% 放宽到 75%，直接决定轨道数
displayarea=0.75

# [lc-1302] 弹幕屏蔽类型快捷开关：播放器内 Ctrl+k 即时开关 顶部/滚动/底部/彩色 等弹幕，
# 与设置面板「弹幕屏蔽与样式」双向同步（真源文件：scripts/uosc_danmaku/danmaku_block_types.json）
# B站弹幕搜索开关（由应用设置面板控制，同时控制自动补源 auto_load_extra）
bili_search_enabled=yes
auto_load_extra=yes
# B站弹幕聚合阈值（单视频弹幕<此值时合并同类候选；0=禁用）
aggregate_threshold=1500
# 自建弹幕接口（danmu_api）：由应用设置面板控制，作为弹幕优选源；未命中自动降级内置B站弹幕
danmu_api_enabled=yes
