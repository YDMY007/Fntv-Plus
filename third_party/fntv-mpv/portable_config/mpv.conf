# MPV 播放器配置文件
# ======================

# 窗口设置
border=no                    # 无边框窗口

# 视频加载缓存设置
cache-secs=120

# 视频输出设置
vo=gpu-next                  # 视频输出驱动。许多后续选项也只能在此三项下正常工作。当前版本默认值即 gpu-next
hwdec=auto-copy              # 硬件解码设置（原配置：使用系统硬解，复制帧到 GPU 纹理，已在你的机器上验证可正常出画面）

# 窗口大小设置
geometry=1280x720            # 统一窗口大小设置 - 保持一致的初始窗口大小为 1280x720

# 自动保存上次配置
save-position-on-quit=yes

# 着色器缓存设置
gpu-shader-cache-dir=~~/.cache  # 着色器缓存目录  

# OSD 和菜单设置
osd-level=1                  # OSD 显示级别
osd-duration=2000            # OSD 显示持续时间（毫秒）
osd-font-size=36             # OSD 字体大小

# 去掉原有进度条
osd-bar=no

# 日志文件设置
log-file=~~/mpv.log

# ═══════════════════════════════════════════════════════════════
# Anime4K 动画专用最佳实践配置 v4.x
# ═══════════════════════════════════════════════════════════════
# 官方文档: https://github.com/bloc97/Anime4K/blob/master/md/GLSL_Instructions_Advanced.md
# 
# 🎌 动画专用模式选择指南:
# 
# 【Ctrl+1 - 模式A】大多数1080p动画的首选
#   适用: 大多数1080p动画、老720p动画、SD动画
#   处理: 高度模糊、重采样瑕疵、压缩伪影
#   效果: 高感知质量、重建大多数退化线条
# 
# 【Ctrl+2 - 模式B】720p动画的最佳选择  
#   适用: 部分1080p动画、大多数720p动画、降采样动画
#   处理: 轻度模糊、下采样振铃、混叠
#   效果: 平衡的质量提升，较少副作用
#
# 【Ctrl+3 - 模式A+A】追求极致质量 (仅限2x+放大)
#   适用: 高质量1080p动画，需要最佳视觉效果
#   警告: 在1080p屏幕观看1080p动画可能过锐化
#   效果: 最高感知质量，重建几乎所有退化线条
#
# 【Ctrl+4 - 模式B+B】720p动画的高质量版本
#   适用: 高质量720p动画处理
#   效果: 模式B的增强版，更好细节恢复
#
# 【Ctrl+5 - 轻量模式】低配置设备专用
#   适用: GPU性能有限的设备
#   变体: 使用S级CNN (最快速度)
#
# 【Ctrl+6 - 降噪专用】辅助功能
#   适用: 噪点较多的视频源
#   效果: 单纯降噪处理，可与其他着色器组合
#
# 🎯 选择建议:
# • 普通用户: Ctrl+1 (模式A) - 最通用
# • 720p动画: Ctrl+2 (模式B) - 专门优化  
# • 追求极致: Ctrl+3 (模式A+A) - 需要高配置
# • 低配置: Ctrl+5 (轻量模式) - 保证流畅
#
# ⚡ 性能目标 (使用 Shift+I 然后按 2 监控):
# • 24fps: ~41ms/帧 • 30fps: ~33ms/帧 • 60fps: ~16ms/帧
#
# 默认不启用任何着色器；默认画质/校色完全由 mpv-user.conf 提供，
# 该文件由「应用设置面板 > 播放器 > 默认 MPV 着色器 / ICC 校色」自动生成，请勿手动编辑。

# ═══════════════════════════════════════════════════════════════
# 着色器（Anime4K / CAS / 真实系 等）
# 默认【不在此处写死】任何着色器链。
# 默认画质模式在应用「设置面板」选择后写入 mpv-user.conf（由应用管理，非 MPV 内部脚本）。
# 播放中仍可用 Ctrl+1~9 临时切换画质、Ctrl+0 关闭、Ctrl+` 清空（仅当前会话，不固化）。
# （以下写死的 A+A 链仅作参考，可删除）
# ═══════════════════════════════════════════════════════════════
# glsl-shaders-append="~~/shaders/Anime4K_Clamp_Highlights.glsl"
# glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_L.glsl"
# glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
# glsl-shaders-append="~~/shaders/Anime4K_AutoDownscalePre_x2.glsl"
# glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_L.glsl"
# glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# ═══════════════════════════════════════════════════════════════
# ICC 校色（默认开启，固化在 mpv-user.conf 的 icc-profile-auto=yes）
# MPV 内可用 Ctrl+i 或 OSC 菜单「视频 > 开/关 自动ICC校色」临时切换（仅当前会话）。
# 如需指定某个具体配置文件，改用：icc-profile="~~/你的配置.icc"
# 注意：ICC 3DLUT 需要 vo=gpu-next（已配置），且显示器需有分配的 ICC 配置才生效
# ═══════════════════════════════════════════════════════════════

# 默认画质/校色由「应用设置面板」自动生成并写入本文件（请勿手动编辑）
# ~~ 指向 mpv 配置目录（portable_config），避免相对 CWD 解析找不到文件
include=~~/mpv-user.conf
# ═══════════════════════════════════════════════════════════════
# vf 视频滤镜链（已移除）
# ⚠️ 注意：不要写 `vf=deband=iterations=...` 这种形式！
#   它会被路由到 libavfilter 的 deband，而 lavfi 的 deband 参数名是
#   1thr/2thr/3thr/4thr，并非 iterations/threshold —— 参数不匹配会导致
#   "Creating filter 'deband' failed" → 整个视频解码链崩溃 → 黑屏有声音。
#   要启用 MPV 自带的 GPU deband，请用 vo 内置选项（见下），而不是 vf 滤镜。
# ═══════════════════════════════════════════════════════════════
# MPV 内置 GPU deband（vo/gpu-next 原生，画质好且不会崩）：
# deband=yes
# deband-iterations=2
# deband-threshold=32
# deband-range=16

# 【Ctrl+7 - 真实系】真人/纪录片专用
#   适用: 真人电影、电视剧、纪录片（不需要 Anime4K 动画超分）
#   效果: CAS 自适应锐化 + 色彩鲜活增强，画面更清晰通透
#
# 【Ctrl+8 - 电影感】动画 + 电影氛围
#   适用: 想要更有"胶片感"的动画观影体验
#   效果: Anime4K 模式A + 胶片粒度 + 色彩增强
#
# 【Ctrl+9 - 全增强】极致画质（需高配置 GPU）
#   适用: 追求最佳视觉效果，不计算力消耗
#   效果: Anime4K 模式A+A + CAS 锐化 + 胶片粒度 + 色彩增强
