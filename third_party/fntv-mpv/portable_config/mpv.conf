# MPV 播放器配置文件
# ======================

# 窗口设置
border=no                    # 无边框窗口

# 视频加载缓存设置
cache-secs=120

# 视频输出设置
vo=gpu-next                  # 视频输出驱动。许多后续选项也只能在此三项下正常工作。当前版本默认值即 gpu-next
hwdec=auto-copy              # 硬件解码设置

# 字幕语言偏好（lc-1016）：内嵌字幕媒体开播时自动优先选中中文轨（先匹配 lang 标签，
# 再对轨标题做子串匹配），避免开播后选中非中文轨或无字幕、需要手动切换。
# fnOS 外挂字幕由应用侧在 path 事件后显式挂载(select)，不受本项影响。
slang=zh,chi,zho,chs,cht,sc,tc,简,繁,中字,中文

# 窗口大小设置
geometry=1280x720            # 统一窗口大小设置 - 保持一致的初始窗口大小为 1280x720

# 自动保存上次配置
save-position-on-quit=yes

# 着色器缓存设置
gpu-shader-cache-dir=~~/.cache  # 着色器缓存目录  

# OSD 和菜单设置
osd-level=1                  # OSD 显示级别
osd-duration=2000            # OSD 显示持续时间（毫秒）
osd-font-size=36             # OSD 字体大小

# 去掉原有进度条
osd-bar=no

# 日志文件设置
log-file=~~/mpv.log

# ═══════════════════════════════════════════════════════════════
# Anime4K 动画专用最佳实践配置 v4.x
# ═══════════════════════════════════════════════════════════════
# 官方文档: https://github.com/bloc97/Anime4K/blob/master/md/GLSL_Instructions_Advanced.md
# 
# 🎌 动画专用模式选择指南:
# 
# 【Ctrl+1 - 模式A】大多数1080p动画的首选
#   适用: 大多数1080p动画、老720p动画、SD动画
#   处理: 高度模糊、重采样瑕疵、压缩伪影
#   效果: 高感知质量、重建大多数退化线条
# 
# 【Ctrl+2 - 模式B】720p动画的最佳选择  
#   适用: 部分1080p动画、大多数720p动画、降采样动画
#   处理: 轻度模糊、下采样振铃、混叠
#   效果: 平衡的质量提升，较少副作用
#
# 【Ctrl+3 - 模式A+A】追求极致质量 (仅限2x+放大)
#   适用: 高质量1080p动画，需要最佳视觉效果
#   警告: 在1080p屏幕观看1080p动画可能过锐化
#   效果: 最高感知质量，重建几乎所有退化线条
#
# 【Ctrl+4 - 模式B+B】720p动画的高质量版本
#   适用: 高质量720p动画处理
#   效果: 模式B的增强版，更好细节恢复
#
# 【Ctrl+5 - 轻量模式】低配置设备专用
#   适用: GPU性能有限的设备
#   变体: 使用S级CNN (最快速度)
#
# 【Ctrl+6 - 降噪专用】辅助功能
#   适用: 噪点较多的视频源
#   效果: 单纯降噪处理，可与其他着色器组合
#
# 🎯 选择建议:
# • 普通用户: Ctrl+1 (模式A) - 最通用
# • 720p动画: Ctrl+2 (模式B) - 专门优化  
# • 追求极致: Ctrl+3 (模式A+A) - 需要高配置
# • 低配置: Ctrl+5 (轻量模式) - 保证流畅
#
# ⚡ 性能目标 (使用 Shift+I 然后按 2 监控):
# • 24fps: ~41ms/帧 • 30fps: ~33ms/帧 • 60fps: ~16ms/帧
#
# 默认不启用任何着色器，通过快捷键按需启用

# ═══════════════════════════════════════════════════════════════
# 着色器 / ICC 配置交由 mpv-user.conf 管理（由应用设置面板写入）
# 本文件不再硬编码着色器，出厂默认“不启用任何着色器”（流畅优先）。
# 如需画质增强，请在应用设置面板选择着色器预设，或手动编辑 mpv-user.conf。
# mpv-user.conf 通过下方 include 加载（~~ 即 portable_config 配置目录）。
# ═══════════════════════════════════════════════════════════════
include=~~/mpv-user.conf

# ═══════════════════════════════════════════════════════════════
# 插帧（AI 补帧）profile —— 由 fntv_interp.lua 在开启插帧时 apply-profile 激活
# 前提：本机已安装对应引擎；未安装时 fntv_interp.lua 会自动回退到 MPV 内置平滑运动。
# 以下 profile 默认注释（不生效）；启用 AI 补帧时按需取消注释并按你的部署填写。
# ═══════════════════════════════════════════════════════════════
#
# [fntv-interp-svp]
# # SVP (SmoothVideo Project) 已安装并运行：MPV 通过 input-ipc-server 接管其插帧管线
# input-ipc-server=\\.\pipe\mpv-svp
# # 实际 vf 由 SVP 自身注入，此处仅确保 IPC 通道可用
#
# [fntv-interp-rife]
# # RIFE AI 补帧（rife-ncnn-vulkan / VapourSynth 等）：按你的部署替换 vf 命令
# # 示例（占位，需本机具备对应运行时与模型）：
# vf=lavfi=[...rife...]
#
# [fntv-interp-nvidia]
# # N 卡 Smooth Motion（RTX50+ 驱动级视频帧生成）—— 由 fntv_interp.lua 的 nvidia 引擎档激活
# # 实际生效配置（gpu-context=winvk + video-sync=audio）由应用侧写入 mpv-interp-nvidia.conf
# # （被下方 mpv-user.conf 的 include 加载），无需手动取消注释本段。
# # 原理：NVIDIA 驱动在 Vulkan(DX12) 呈现的视频帧上做帧生成；D3D11 上下文 SM 不生效，故必须用 winvk。
# # ⚠️ 前提：① 显卡 RTX50+；② 在 NVIDIA App「程序设置」将本播放器 mpv.exe 单独加入并开启 Smooth Motion
# #       （仅全局开启对多数播放器无效，须按 exe 注册；NVIDIA App / Profile Inspector 均可）。
# # 注意：gpu-context 是启动项，切换 N 卡引擎后需重启一次播放器才生效。
