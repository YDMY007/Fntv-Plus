# N 卡 Smooth Motion（RTX50 驱动级）开关：由 mpv-interp-nvidia.conf 控制
# （应用「插帧引擎=N 卡」时写入 gpu-context=winvk；关闭即清空，不影响其它引擎/默认呈现）
include=~~/mpv-interp-nvidia.conf
glsl-shaders-append=~~/shaders/Anime4K_Clamp_Highlights.glsl
glsl-shaders-append=~~/shaders/Anime4K_Restore_CNN_L.glsl
glsl-shaders-append=~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl
glsl-shaders-append=~~/shaders/Anime4K_AutoDownscalePre_x2.glsl
glsl-shaders-append=~~/shaders/Anime4K_Restore_CNN_L.glsl
glsl-shaders-append=~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl
icc-profile-auto=yes
# ── Fntv-Plus 渲染预设 begin ──
# preset=quality
vo=gpu-next
scale=ewa_lanczossharp
dscale=hermite
cscale=ewa_lanczossoft
deband=yes
deband-iterations=2
hdr-compute-peak=yes
