  <script>
    const status = document.getElementById('status');
    const boot = document.getElementById('boot');
    const logEl = document.getElementById('log');
    // [自激防护] 早期实现是 log() 直接 += 到 #log.textContent —— 而 payload 内部也有
    //   MutationObserver：日志写 DOM → 触发 observer → observer 回调又打日志 → 无限自激，
    //   主线程被微任务饿死（DOMContentLoaded 都派发不了，页面完全无响应）。
    //   这里改成「缓冲 + rAF 批量 flush」：log() 本身不再触碰 DOM，打破自激链条。
    let logBuf = [];
    let logFlushScheduled = false;
    function flushLog() {
      logFlushScheduled = false;
      if (!logBuf.length) return;
      const chunk = logBuf.join('');
      logBuf = [];
      if (logEl.textContent.length > 20000) logEl.textContent = logEl.textContent.slice(-8000);
      logEl.appendChild(document.createTextNode(chunk));
    }
    function log(...a) {
      logBuf.push(a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n');
      if (!logFlushScheduled) { logFlushScheduled = true; requestAnimationFrame(flushLog); }
    }
    window.addEventListener('error', e => { status.textContent = '脚本错误'; status.className = 'badge err'; log('❌', e.message); });
    window.addEventListener('unhandledrejection', e => { log('❌ promise', e.reason); });
    const orig = console.error.bind(console); console.error = (...a) => { log('[err]', ...a); orig(...a); };
    const oLog = console.log.bind(console); console.log = (...a) => { log(...a); oLog(...a); };
  </script>
  <!-- 注入打包后的 payload（复用自 Fntv-Plus 的 embyWall） -->

      else { status.textContent = 'payload 未暴露 boot'; status.className = 'badge err'; }
